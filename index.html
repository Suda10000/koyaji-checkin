<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>こやじ受付ミニアプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- LIFF SDK 読み込み -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    label { display:block; margin-top:12px; }
    input { width:100%; padding:8px; box-sizing:border-box; }
    button { margin-top:16px; padding:10px 16px; }
    #main { max-width:480px; margin:0 auto; }
  </style>
</head>
<body>
<div id="main">
  <h2>PTA受付ミニアプリ</h2>

  <div id="status"></div>

  <!-- 初回登録フォーム -->
  <div id="registerForm" style="display:none;">
    <h3>初回登録フォーム</h3>

    <label>保護者名</label>
    <input id="parentName" type="text">

    <label>生徒名</label>
    <input id="studentName" type="text">

    <label>学年</label>
    <input id="grade" type="number">

    <label>クラス</label>
    <input id="classText" type="text">

    <button id="registerBtn">登録する</button>
    <p id="registerResult"></p>
  </div>

  <!-- 受付ボタン -->
  <div id="checkinArea" style="display:none;">
    <h3>受付</h3>
    <p id="userInfo"></p>
    <button id="checkinBtn">この端末で受付する</button>
    <p id="checkinResult"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

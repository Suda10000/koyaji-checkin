<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>初回登録</title>

    <!-- スマホ表示を強制（LINEブラウザ縮小対策） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- ★フォーム縮小バグ対策CSS（LINEブラウザでも必ず大きく表示） -->
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            font-size: 18px;
            zoom: 1 !important;
        }

        input {
            margin: 10px 0;
            padding: 14px !important;
            width: 300px !important;
            font-size: 20px !important;
            height: 50px !important;
            box-sizing: border-box;
        }

        button {
            padding: 14px 24px !important;
            font-size: 20px !important;
            width: 300px !important;
            height: 55px !important;
            margin-top: 15px;
        }

        #status {
            margin-bottom: 15px;
            font-size: 16px;
            color: #444;
        }
    </style>
</head>

<body>

<h2>初回登録フォーム</h2>

<div id="status"></div>

<div id="registerForm" style="display:none;">
    <div>
        保護者名：<br>
        <input id="parentName" placeholder="山田太郎">
    </div>

    <div>
        生徒名：<br>
        <input id="studentName" placeholder="山田花子">
    </div>

    <div>
        学年：<br>
        <input id="grade" placeholder="6">
    </div>

    <div>
        クラス：<br>
        <input id="className" placeholder="A">
    </div>

    <button id="registerBtn">登録する</button>
    <div id="registerResult" style="margin-top:10px;color:blue;"></div>
</div>

<!-- 初回登録画面では非表示 -->
<div id="checkinArea" style="display:none;">
    <button id="checkinBtn">受付する</button>
    <div id="checkinResult"></div>
</div>

<div id="userInfo" style="display:none;"></div>

<!-- script.js 読み込み -->
<script src="script.js"></script>

</body>
</html>

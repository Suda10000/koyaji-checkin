<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>初回登録</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="script.js"></script>
</head>
<body>

<h2>初回登録フォーム</h2>

<div id="registerForm" style="display:none;">
    保護者名：<input id="parentName"><br>
    生徒名：<input id="studentName"><br>
    学年：<input id="grade"><br>
    クラス：<input id="className"><br>
    <button id="registerBtn">登録する</button>
    <div id="registerResult"></div>
</div>

<!-- 初回登録画面では非表示になる -->
<div id="checkinArea" style="display:none;">
    <button id="checkinBtn">受付する</button>
    <div id="checkinResult"></div>
</div>

<div id="userInfo"></div>

</body>
</html>
